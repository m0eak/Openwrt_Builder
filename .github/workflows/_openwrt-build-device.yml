name: OpenWrt build device

on:
  workflow_call:
    inputs:
      device:
        description: Device name used for artifact names.
        required: true
        type: string
      config_file:
        description: Repository config file to move into openwrt/.config.
        required: true
        type: string
      extra_config_file:
        description: Optional repository config fragment appended after the base config.
        default: ""
        type: string
      workflow_name:
        description: Logical workflow/device name consumed by custom shell scripts.
        required: true
        type: string
      repo_url:
        description: OpenWrt source repository URL.
        required: true
        type: string
      repo_branch:
        description: OpenWrt source branch or tag.
        required: true
        type: string
      feeds_conf:
        description: Custom feeds.conf.default path in the repository.
        default: feeds.conf.default
        type: string
      diy_p1_sh:
        description: Part 1 custom script path.
        default: ./sh/scripts-part1.sh
        type: string
      diy_p2_sh:
        description: Part 2 custom script path.
        default: ./sh/scripts-part2.sh
        type: string
      default_setting:
        description: Custom default settings package path.
        default: ./default-settings-m0eak
        type: string
      cache_toolchain:
        description: Whether to enable toolchain cache.
        default: "true"
        type: string
      timezone:
        description: Runner timezone.
        default: Asia/Shanghai
        type: string
      install_automake_117:
        description: Install local Automake 1.17 before cloning source.
        default: false
        type: boolean
      sonic_fullcone:
        description: Apply Sonic Fullcone patch after feeds install.
        default: false
        type: boolean
      shared_build:
        description: Build IPQ profiles together with separate device root filesystems.
        default: false
        type: boolean
      shared_docker:
        description: Append docker config in shared mode.
        default: false
        type: boolean
      producer_validation:
        description: Export and validate a standalone shared-build ImageBuilder bundle.
        default: false
        type: boolean

jobs:
  build:
    name: 编译 ${{ inputs.device }}
    # 无法按构建号锁定镜像（actions/runner-images#13034 官方拒绝，带日期 label 会导致永久 queued）。
    # ubuntu-22.04 当前镜像 20260907.292 的 step6 hang / step7 gnu.org 超时已由脚本层 workaround
    # 规避（strip full-upgrade + automake 多源 fallback）。若仍不稳，plan B 是迁移 ubuntu-24.04。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Show runner environment
        shell: bash
        run: |
          echo "::group::Build workflow inputs"
          echo "device=${{ inputs.device }}"
          echo "workflow_name=${{ inputs.workflow_name }}"
          echo "repo_url=${{ inputs.repo_url }}"
          echo "repo_branch=${{ inputs.repo_branch }}"
          echo "config_file=${{ inputs.config_file }}"
          echo "extra_config_file=${{ inputs.extra_config_file }}"
          echo "feeds_conf=${{ inputs.feeds_conf }}"
          echo "diy_p1_sh=${{ inputs.diy_p1_sh }}"
          echo "diy_p2_sh=${{ inputs.diy_p2_sh }}"
          echo "default_setting=${{ inputs.default_setting }}"
          echo "cache_toolchain=${{ inputs.cache_toolchain }}"
          echo "install_automake_117=${{ inputs.install_automake_117 }}"
          echo "sonic_fullcone=${{ inputs.sonic_fullcone }}"
          echo "shared_build=${{ inputs.shared_build }}"
          echo "shared_docker=${{ inputs.shared_docker }}"
          echo "producer_validation=${{ inputs.producer_validation }}"
          for path in \
            "${{ inputs.config_file }}" \
            "${{ inputs.extra_config_file }}" \
            "${{ inputs.feeds_conf }}" \
            "${{ inputs.diy_p1_sh }}" \
            "${{ inputs.diy_p2_sh }}" \
            "${{ inputs.default_setting }}" \
            "files"; do
            [ -z "$path" ] && continue
            if [ -e "$path" ]; then
              echo "exists: $path"
            else
              echo "missing: $path"
            fi
          done
          echo "::endgroup::"

          echo "::group::Runner environment"
          echo "================================================="
          echo "GitHub Actions runner environment"
          echo "================================================="
          lscpu
          echo "CPU threads: $(nproc)"
          free -h
          df -hT
          uname -a
          lsb_release -a || true
          echo "::endgroup::"

      - name: Optimize disk space
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"

      - name: Remove large preinstalled tools
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/share/swift /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk after cleanup:"
          df -hT

      - name: Tune block device readahead (runner-loss mitigation)
        shell: bash
        run: |
          # actions/runner-images#13770：新内核默认 read_ahead_kb 由 128 提到 4096，
          # 重 I/O（apt 装包 / 编译 / 下载）时打满 page cache → I/O 抖动 → hosted
          # runner lost communication。官方 udev 修复(#13938)只 pin SCSI(sd*)，
          # Azure v5/v6 宿主机的 NVMe(nvme*) 漏网。这里对所有块设备统一 pin 128。
          # 运行时 sysfs 参数，免重启、job 结束 VM 即销毁，无持久副作用。
          echo "== read_ahead_kb 调整前 =="
          for f in /sys/block/*/queue/read_ahead_kb; do printf '%s = %s\n' "$f" "$(cat "$f" 2>/dev/null)"; done
          for f in /sys/block/*/queue/read_ahead_kb; do echo 128 | sudo tee "$f" >/dev/null 2>&1 || true; done
          echo "== read_ahead_kb 调整后 =="
          for f in /sys/block/*/queue/read_ahead_kb; do printf '%s = %s\n' "$f" "$(cat "$f" 2>/dev/null)"; done

      - name: Initialize build environment
        shell: bash
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: ${{ inputs.timezone }}
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq purge azure-cli* ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          # 防托管 runner 失联：ubuntu-22.04 新镜像(20260907.292)上 immortalwrt init
          # 脚本的 apt full-upgrade 触发 hosted runner lost communication（同类回归见
          # actions/runner-images#13770）。full-upgrade 仅刷新已装包版本，对编译非必需，
          # 下载脚本后剥离该行；hold + NEEDRESTART_MODE=n 双保险防服务重启。
          sudo apt-mark hold systemd systemd-resolved systemd-sysv dbus udev libsystemd0 libdbus-1-3 || true
          curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh -o /tmp/iwe.sh
          sed -i 's/^[[:space:]]*apt full-upgrade.*/: # full-upgrade removed (runner-loss workaround)/' /tmp/iwe.sh
          grep -q "runner-loss workaround" /tmp/iwe.sh || { echo "FATAL: full-upgrade strip failed"; exit 1; }
          sudo NEEDRESTART_MODE=n NEEDRESTART_SUSPEND=1 bash /tmp/iwe.sh
          sudo apt-mark unhold systemd systemd-resolved systemd-sysv dbus udev libsystemd0 libdbus-1-3 || true
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo -E apt-get install -y clang llvm nodejs dwarves
          sudo npm install -g pnpm
          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir
          echo "WORKFLOW_NAME=${{ inputs.workflow_name }}" >> "$GITHUB_ENV"
          echo "TAG=${{ inputs.repo_branch }}" >> "$GITHUB_ENV"

      - name: Install local Automake 1.17
        if: ${{ inputs.install_automake_117 }}
        shell: bash
        run: |
          set -e
          PREFIX=/workdir/automake-1.17
          BUILD_DIR=/workdir/automake-1.17-build
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          # 多源 fallback：gnu.org 在部分 Azure 宿主机上会 connect timeout
          OK=0
          for base in \
            "https://ftp.gnu.org/gnu/automake" \
            "https://mirrors.kernel.org/gnu/automake" \
            "https://mirror.netcologne.de/gnu/automake" \
            "https://mirrors.tuna.tsinghua.edu.cn/gnu/automake"; do
            echo "尝试下载: $base/automake-1.17.tar.xz"
            if curl -fL --connect-timeout 20 --max-time 120 -o automake-1.17.tar.xz "$base/automake-1.17.tar.xz"; then
              OK=1; echo "下载成功: $base"; break
            fi
            echo "该源失败，切换下一个…"
          done
          [ "$OK" = "1" ] || { echo "FATAL: 所有 automake 源均下载失败"; exit 1; }
          rm -rf automake-1.17-src
          mkdir -p automake-1.17-src
          tar -xf automake-1.17.tar.xz -C automake-1.17-src --strip-components=1
          cd automake-1.17-src
          ./configure --prefix="$PREFIX"
          make -j"$(nproc)"
          make install
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/automake-1.17" --version | sed -n '1p'
          "$PREFIX/bin/aclocal-1.17" --version | sed -n '1p'

      - name: Clone firmware source
        id: clone-source
        shell: bash
        working-directory: /workdir
        run: |
          git clone -b "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" --single-branch --depth 1 openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          git fetch --tags || true
          echo "::group::OpenWrt source revision"
          git log -1 --oneline
          git remote -v
          git status --short
          echo "::endgroup::"
          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
          echo "openwrt-path=$PWD" >> "$GITHUB_OUTPUT"

      - name: Update feeds and run custom script part 1
        shell: bash
        run: |
          cd openwrt
          [ -e "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" ] && cp "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" ./feeds.conf.default
          echo "::group::Feeds configuration"
          pwd
          ls -l feeds.conf.default || true
          sed -n '1,80p' feeds.conf.default || true
          echo "::endgroup::"
          ./scripts/feeds update -a
          chmod +x "$GITHUB_WORKSPACE/${{ inputs.diy_p1_sh }}"
          "$GITHUB_WORKSPACE/${{ inputs.diy_p1_sh }}"

      - name: Install feeds
        shell: bash
        run: cd openwrt && ./scripts/feeds install -a

      - name: Apply Sonic Fullcone patch
        if: ${{ inputs.sonic_fullcone }}
        shell: bash
        run: |
          cd openwrt
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

      - name: Apply custom config and run custom script part 2
        shell: bash
        run: |
          [ -e "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" ] && mv "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" openwrt/package/default-settings-m0eak
          [ -d "$GITHUB_WORKSPACE/files" ] && mv "$GITHUB_WORKSPACE/files" openwrt/files
          if ${{ inputs.producer_validation }} && ! ${{ inputs.shared_build }}; then
            echo "Producer validation requires shared_build=true" >&2
            exit 1
          fi
          if ${{ inputs.shared_build }}; then
            cd openwrt
            chmod +x "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
            "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
            cp "$GITHUB_WORKSPACE/config/axt1800.config" .config
            echo "::group::Refresh package metadata"
            make prepare-tmpinfo
            echo "::endgroup::"
            DOCKER_ARGS=()
            if ${{ inputs.shared_docker }}; then
              DOCKER_ARGS=(--docker)
            fi
            mkdir -p .ipq-shared-baselines
            for pair in "AXT-1800:axt1800.config" "JDC-AX6600:jdcax6600.config"; do
              device="${pair%%:*}"
              cp "$GITHUB_WORKSPACE/config/${pair#*:}" .config
              if ${{ inputs.shared_docker }}; then
                cat "$GITHUB_WORKSPACE/config/docker-ipq.config" >> .config
              fi
              make defconfig 2>&1 | tee ".ipq-shared-baselines/$device.log"
              if grep -Eq 'error:|recursive dependency' ".ipq-shared-baselines/$device.log"; then
                echo "Invalid single-device configuration: $device" >&2
                exit 1
              fi
              cp .config ".ipq-shared-baselines/$device.config"
            done
            python3 "$GITHUB_WORKSPACE/sh/ipq-shared-build.py" \
              generate \
              --project-root "$GITHUB_WORKSPACE" \
              --source-root "$PWD" \
              --device AXT-1800 --device JDC-AX6600 \
              "${DOCKER_ARGS[@]}" \
              --baseline-dir .ipq-shared-baselines \
              --out .config
          else
            [ -e "${{ inputs.config_file }}" ] && mv "${{ inputs.config_file }}" openwrt/.config
            if [ -n "${{ inputs.extra_config_file }}" ] && [ -e "${{ inputs.extra_config_file }}" ]; then
              cat "${{ inputs.extra_config_file }}" >> openwrt/.config
            fi
            cd openwrt
            chmod +x "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
            "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
          fi
          echo "::group::Pre-defconfig workspace snapshot"
          pwd
          ls -ld package/default-settings-m0eak files .config 2>/dev/null || true
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(docker|dockerd|luci-app-dockerman|containerd|runc))' .config || true
          echo "::endgroup::"
          if ${{ inputs.shared_build }}; then
            if ${{ inputs.producer_validation }}; then
              for symbol in CONFIG_IB CONFIG_IB_STANDALONE CONFIG_USE_APK; do
                sed -i -E "/^(# )?${symbol}(=| is not set)/d" .config
              done
              printf '%s\n' \
                'CONFIG_IB=y' \
                'CONFIG_IB_STANDALONE=y' \
                'CONFIG_USE_APK=y' >> .config
            fi
            make defconfig 2>&1 | tee .ipq-shared-baselines/shared.log
            if grep -Eq 'error:|recursive dependency' .ipq-shared-baselines/shared.log; then
              echo "Invalid shared configuration" >&2
              exit 1
            fi
          else
            make defconfig
          fi
          if ${{ inputs.producer_validation }}; then
            for symbol in CONFIG_IB CONFIG_IB_STANDALONE CONFIG_USE_APK; do
              if ! grep -Fxq "${symbol}=y" .config; then
                echo "Producer validation requires ${symbol}=y after defconfig" >&2
                exit 1
              fi
            done
          fi
          echo "::group::Current diffconfig"
          ./scripts/diffconfig.sh
          echo "::endgroup::"

      - name: Audit shared normalized package intent
        if: ${{ inputs.shared_build }}
        shell: bash
        run: |
          cd openwrt
          DOCKER_ARGS=()
          if ${{ inputs.shared_docker }}; then DOCKER_ARGS=(--docker); fi
          python3 "$GITHUB_WORKSPACE/sh/ipq-shared-build.py" audit-normalized \
            --project-root "$GITHUB_WORKSPACE" \
            --source-root "$PWD" \
            --normalized-config .config \
            --baseline-dir .ipq-shared-baselines \
            --device AXT-1800 --device JDC-AX6600 \
            "${DOCKER_ARGS[@]}"
          python3 "$GITHUB_WORKSPACE/sh/ipq-shared-build.py" patch-manifests \
            --source-root "$PWD"

      - name: Fingerprint shared cache inputs
        id: cache-input
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          fingerprint=$(
            {
              printf 'config=%s\n' "$(sha256sum .config | cut -d ' ' -f1)"
              printf 'feeds-conf=%s\n' "$(sha256sum feeds.conf.default | cut -d ' ' -f1)"

              for feed_dir in feeds/*; do
                [ -d "$feed_dir" ] || continue
                feed_root=$(git -C "$feed_dir" rev-parse --show-toplevel 2>/dev/null) || continue
                feed_path=$(cd "$feed_dir" && pwd -P)
                [ "$feed_root" = "$feed_path" ] || continue
                commit=$(git -C "$feed_dir" rev-parse --verify HEAD)
                printf 'feed:%s=%s\n' "${feed_dir#feeds/}" "$commit"
              done

              golang_feed=feeds/packages/lang/golang
              if [ -d "$golang_feed" ]; then
                golang_root=$(git -C "$golang_feed" rev-parse --show-toplevel 2>/dev/null || true)
                golang_path=$(cd "$golang_feed" && pwd -P)
                if [ "$golang_root" = "$golang_path" ]; then
                  commit=$(git -C "$golang_feed" rev-parse --verify HEAD)
                  printf 'golang-feed=%s\n' "$commit"
                fi
              fi

              for custom_dir in package/custom/*; do
                [ -d "$custom_dir" ] || continue
                custom_root=$(git -C "$custom_dir" rev-parse --show-toplevel 2>/dev/null) || continue
                custom_path=$(cd "$custom_dir" && pwd -P)
                [ "$custom_root" = "$custom_path" ] || continue
                commit=$(git -C "$custom_dir" rev-parse --verify HEAD)
                printf 'custom:%s=%s\n' "${custom_dir#package/custom/}" "$commit"
              done
            } | LC_ALL=C sort | sha256sum | cut -d ' ' -f1
          )

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Shared cache input fingerprint: $fingerprint"

      - name: Cache toolchain
        uses: HiGarfield/cachewrtbuild@main
        if: ${{ inputs.cache_toolchain != 'false' }}
        with:
          ccache: true
          mixkey: ${{ github.workflow }}-${{ inputs.workflow_name }}-${{ hashFiles(inputs.config_file, '**/scripts-part*.sh') }}-${{ steps.cache-input.outputs.fingerprint }}
          prefix: ${{ steps.clone-source.outputs.openwrt-path }}

      - name: Download packages
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)" || make download -j1 V=s
          echo "::group::Download directory summary"
          du -sh dl || true
          find dl -size -1024c -exec ls -l {} \; || true
          echo "::endgroup::"
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        shell: bash
        run: |
          cd openwrt
          echo "Compiling with $(nproc) threads..."
          make -j"$(expr "$(nproc)" + 1)" || make -j1 V=s

      - name: Stage and validate IPQ ImageBuilder producer
        if: ${{ inputs.producer_validation }}
        shell: bash
        env:
          BUILDER_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd openwrt

          TARGET_DIR="bin/targets/qualcommax/ipq60xx"
          BUNDLE="$GITHUB_WORKSPACE/ipq-imagebuilder-producer"
          mapfile -d '' IMAGEBUILDERS < <(
            find "$TARGET_DIR" -maxdepth 1 -type f \
              -name '*imagebuilder*.tar.zst' -print0
          )
          if [ "${#IMAGEBUILDERS[@]}" -ne 1 ]; then
            printf 'Expected exactly one ImageBuilder archive under %s, found %s\n' \
              "$TARGET_DIR" "${#IMAGEBUILDERS[@]}" >&2
            printf '%s\n' "${IMAGEBUILDERS[@]}" >&2
            exit 1
          fi

          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/imagebuilder" "$BUNDLE/metadata"
          cp "${IMAGEBUILDERS[0]}" "$BUNDLE/imagebuilder.tar.zst"
          tar --zstd -xf "$BUNDLE/imagebuilder.tar.zst" \
            -C "$BUNDLE/imagebuilder" --strip-components=1

          [ -s "$BUNDLE/imagebuilder/.config" ] || {
            echo "ImageBuilder archive is missing .config" >&2
            exit 1
          }
          for symbol in CONFIG_IB CONFIG_IB_STANDALONE CONFIG_USE_APK; do
            if ! grep -Fxq "${symbol}=y" "$BUNDLE/imagebuilder/.config"; then
              echo "ImageBuilder archive does not preserve ${symbol}=y" >&2
              exit 1
            fi
          done

          PROFILES="$TARGET_DIR/profiles.json"
          [ -s "$PROFILES" ] || {
            echo "Build output is missing $PROFILES" >&2
            exit 1
          }
          cp "$PROFILES" "$BUNDLE/imagebuilder/profiles.json"
          cp "$BUNDLE/imagebuilder/.config" "$BUNDLE/metadata/.config"
          cp .config "$BUNDLE/metadata/source.config"
          cp "$BUNDLE/imagebuilder/.targetinfo" "$BUNDLE/metadata/targetinfo"
          cp "$BUNDLE/imagebuilder/.packageinfo" "$BUNDLE/metadata/packageinfo"
          cp "$PROFILES" "$BUNDLE/metadata/profiles.json"

          if grep -Fxq 'CONFIG_SIGNATURE_CHECK=y' .config; then
            PRIVATE_KEY="$PWD/private-key.pem"
            [ -s "$PRIVATE_KEY" ] || {
              echo "Signed APK build is missing private-key.pem" >&2
              exit 1
            }
            mkdir -p "$BUNDLE/imagebuilder/keys"
            cp "$PRIVATE_KEY" "$BUNDLE/imagebuilder/keys/local-private-key.pem"
            trap 'rm -f "$BUNDLE/imagebuilder/keys/local-private-key.pem"' EXIT
          fi
          make -C "$BUNDLE/imagebuilder" package_index V=s
          rm -f "$BUNDLE/imagebuilder/keys/local-private-key.pem"
          trap - EXIT

          ZSTD="$PWD/staging_dir/host/bin/zstd"
          [ -x "$ZSTD" ] || {
            echo "Host zstd tool is missing: $ZSTD" >&2
            exit 1
          }
          tar -I "$ZSTD -T0 --ultra -20" \
            -cf "$BUNDLE/imagebuilder.repacked.tar.zst" \
            -C "$BUNDLE" imagebuilder
          mv "$BUNDLE/imagebuilder.repacked.tar.zst" "$BUNDLE/imagebuilder.tar.zst"
          ARCHIVE_LIST="$(mktemp "$RUNNER_TEMP/ipq-imagebuilder-list.XXXXXX")"
          tar -I "$ZSTD -d" -tf "$BUNDLE/imagebuilder.tar.zst" > "$ARCHIVE_LIST"
          if ! grep -Fxq 'imagebuilder/packages/packages.adb' "$ARCHIVE_LIST"; then
            rm -f "$ARCHIVE_LIST"
            echo "Repacked ImageBuilder archive is missing its APK repository index" >&2
            exit 1
          fi
          rm -f "$ARCHIVE_LIST"

          python3 "$GITHUB_WORKSPACE/sh/ipq-imagebuilder-producer.py" seal \
            --bundle-root "$BUNDLE" \
            --source-root "$PWD" \
            --target qualcommax/ipq60xx \
            --architecture aarch64_cortex-a53 \
            --builder-revision "$BUILDER_REVISION"
          python3 "$GITHUB_WORKSPACE/sh/ipq-imagebuilder-producer.py" validate \
            --bundle-root "$BUNDLE"

      - name: Upload IPQ ImageBuilder producer artifact
        if: ${{ inputs.producer_validation }}
        uses: actions/upload-artifact@main
        with:
          name: ipq-imagebuilder-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ipq-imagebuilder-producer/
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary build files
        if: success()
        shell: bash
        run: |
          cd openwrt
          rm -rf build_dir tmp

      - name: Organize firmware files
        id: organize
        if: ${{ !inputs.producer_validation }}
        shell: bash
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          if ${{ inputs.shared_build }}; then
            OUT="$GITHUB_WORKSPACE/all-artifacts"
            rm -rf "$OUT"
            python3 "$GITHUB_WORKSPACE/sh/ipq-shared-build.py" split-outputs \
              --source-dir "$PWD" \
              --destination "$OUT" \
              --device AXT-1800 --device JDC-AX6600
          fi
          echo "::group::Firmware files"
          pwd
          find . -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "::endgroup::"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "firmware-path=$PWD" >> "$GITHUB_OUTPUT"

      - name: Extract per-device package lists (shared)
        if: ${{ inputs.shared_build && !inputs.producer_validation }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/all-artifacts"
          for pair in \
            "AXT-1800:firmware-AXT-1800" \
            "JDC-AX6600:firmware-JDC-AX6600"; do
            device="${pair%%:*}"
            dir="$OUT/${pair##*:}"
            mkdir -p "$OUT/package-list-$device"
            # Require exactly one per-device manifest and reuse it for the list.
            manifest=$(find "$dir" -maxdepth 1 -name '*.manifest' -print -quit)
            [ -n "$manifest" ] || { echo "missing manifest for $device" >&2; exit 1; }
            python3 "$GITHUB_WORKSPACE/sh/ipq-shared-build.py" package-list \
              --manifest "$manifest" \
              --out "$OUT/package-list-$device/packages.txt"
          done

      - name: Extract LuCI package list from final build config
        if: ${{ !inputs.shared_build }}
        shell: bash
        run: |
          CONFIG_BUILDINFO="${{ steps.organize.outputs.firmware-path }}/config.buildinfo"
          echo "::group::LuCI package extraction from final config"
          echo "Extracting LuCI packages from $CONFIG_BUILDINFO"
          if [ ! -s "$CONFIG_BUILDINFO" ]; then
            echo "ERROR: final config.buildinfo not found or empty: $CONFIG_BUILDINFO" >&2
            exit 1
          fi
          wc -l "$CONFIG_BUILDINFO"
          sha256sum "$CONFIG_BUILDINFO"

          grep -E '^CONFIG_PACKAGE_luci-app-[^=]+=[ym]$' "$CONFIG_BUILDINFO" | \
            sed -e 's/^CONFIG_PACKAGE_//g' -e 's/=[ym]$//g' | \
            sort > "$GITHUB_WORKSPACE/packages.txt" || true

          if [ -s "$GITHUB_WORKSPACE/packages.txt" ]; then
            cat "$GITHUB_WORKSPACE/packages.txt"
          else
            echo "No LuCI package information found in final build config." > "$GITHUB_WORKSPACE/packages.txt"
          fi
          echo "::endgroup::"

      - name: Upload package list artifact
        uses: actions/upload-artifact@main
        if: ${{ !inputs.shared_build && !inputs.producer_validation }}
        with:
          name: package-list-${{ inputs.device }}
          path: ${{ github.workspace }}/packages.txt

      - name: Upload AXT package list artifact (shared)
        if: ${{ inputs.shared_build && !inputs.producer_validation }}
        uses: actions/upload-artifact@main
        with:
          name: package-list-AXT-1800
          path: ${{ github.workspace }}/all-artifacts/package-list-AXT-1800/*

      - name: Upload JDC package list artifact (shared)
        if: ${{ inputs.shared_build && !inputs.producer_validation }}
        uses: actions/upload-artifact@main
        with:
          name: package-list-JDC-AX6600
          path: ${{ github.workspace }}/all-artifacts/package-list-JDC-AX6600/*

      - name: Upload firmware artifact
        if: ${{ !inputs.shared_build && !inputs.producer_validation }}
        uses: actions/upload-artifact@main
        with:
          name: firmware-${{ inputs.device }}
          path: ${{ steps.organize.outputs.firmware-path }}

      - name: Upload AXT firmware artifact (shared)
        if: ${{ inputs.shared_build && !inputs.producer_validation }}
        uses: actions/upload-artifact@main
        with:
          name: firmware-AXT-1800
          path: ${{ github.workspace }}/all-artifacts/firmware-AXT-1800

      - name: Upload JDC firmware artifact (shared)
        if: ${{ inputs.shared_build && !inputs.producer_validation }}
        uses: actions/upload-artifact@main
        with:
          name: firmware-JDC-AX6600
          path: ${{ github.workspace }}/all-artifacts/firmware-JDC-AX6600

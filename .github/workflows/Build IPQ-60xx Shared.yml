name: Build IPQ-60xx Shared

on:
  workflow_dispatch:
    inputs:
      docker:
        description: '是否编译 docker'
        required: false
        default: 'false'
      tag:
        description: 'libwrt 版本'
        required: false
        default: '25.12.6'

jobs:
  shared-build:
    name: Shared IPQ build
    uses: ./.github/workflows/_openwrt-build-device.yml
    with:
      device: shared
      config_file: ./config/axt1800.config
      workflow_name: IPQ60xx-Shared
      repo_url: https://github.com/m0eak/libwrt.git
      repo_branch: ${{ inputs.tag != '' && inputs.tag || '25.12.6' }}
      shared_build: true
      shared_docker: ${{ inputs.docker == 'true' }}
